plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "software.bernie.geckolib:geckolib-fabric-$rootProject.minecraft_version:$rootProject.geckolib_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// Compatibility check in a dev client only: ./gradlew :fabric:runClient -PbetterCombat runs with Better Combat and its
// dependencies (docs/PLANO_PARTES.md). Never in the jar; without the property the build does not touch Modrinth.
if (project.hasProperty('betterCombat')) {
    repositories {
        maven { url = 'https://api.modrinth.com/maven' }
    }
    dependencies {
        modLocalRuntime 'maven.modrinth:better-combat:1.9.0+1.20.1-fabric'
        modLocalRuntime 'maven.modrinth:playeranimator:1.0.2-rc1+1.20-fabric'
        modLocalRuntime 'maven.modrinth:cloth-config:11.1.136+fabric'
    }
}

// Hats Renewed in a dev client only: ./gradlew :fabric:runClient -PhatsRenewed (client.compat.HatsCompat). Never in the jar.
if (project.hasProperty('hatsRenewed')) {
    repositories {
        maven { url = 'https://api.modrinth.com/maven' }
    }
    dependencies {
        modLocalRuntime 'maven.modrinth:hats-renewed:20.1.3-mc1.20.1-fabric'
    }
}

processResources {
    inputs.property 'version', project.version
    // era resource packs live in common (generated by tools/texpack); shipped from here so the pack loader finds
    // them in this mod, in dev runs and in the jar alike (see common/build.gradle)
    from(rootProject.file('common/src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
