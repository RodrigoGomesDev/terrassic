name: Validação

on:
  push:
    branches: [main, 'paralelo/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Recursos e build Fabric + Forge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter fontes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle e validar wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Conferir recursos sem regenerar
        run: python3 -B tools/validation/check_project.py

      - name: Exercitar fixtures de integridade e protocolo
        run: python3 -B -m unittest discover -s tools/validation -p 'test_*.py'

      - name: Conferir orçamento e distribuição de spawn
        run: python3 -B tools/validation/check_spawn_budget.py

      - name: Compilar os dois loaders e executar regressões de pesquisa
        run: ./gradlew build --no-daemon --stacktrace
