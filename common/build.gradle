architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API: cross-loader registries, events, spawn eggs, biome spawns.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // GeckoLib: the common code compiles against the Fabric build of GeckoLib.
    // Its public API (software.bernie.geckolib.*) is identical on Forge.
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-$rootProject.minecraft_version:$rootProject.geckolib_version"
}

// The era resource packs (resourcepacks/<era>/, generated by tools/texpack) are written here but shipped by each
// loader module (see processResources in fabric/ and forge/): the pack loaders only look inside the loader's own mod,
// and in a dev run (runClient) Architectury loads this common module as a separate mod. Kept out of the common jar
// so the release jar does not carry them twice.
processResources {
    exclude 'resourcepacks/**'
}
